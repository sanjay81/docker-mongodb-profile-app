# Standalone lab: does not load compose.yaml or the local override.
# No database host port; only synthetic data belongs in these volumes.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      PORT: "3000"
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGODB_DB: recovery_lab
      MONGODB_COLLECTION: users
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 2
      start_period: 10s
  mongodb:
    image: mongo:8.0
    volumes:
      - lab-data:/data/db
      - lab-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
volumes:
  lab-data: {}
  lab-config: {}
