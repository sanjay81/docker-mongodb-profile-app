name: Container Lab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          node --check server.js
          node --check scripts/recovery-lab.cjs

      - name: Create local CI configuration
        run: node scripts/setup-env.cjs

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build application image
        run: docker build .
